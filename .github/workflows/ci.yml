name: SupportOS AI CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: supportos_test
          POSTGRES_USER: supportos_user
          POSTGRES_PASSWORD: supportos_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Run Backend Lint Checks
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://supportos_user:supportos_password@localhost:5432/supportos_test
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Run Backend Test Suite (Pytest)
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./novacart.db
          REDIS_URL: redis://localhost:6379/0
          DISABLE_WEBHOOK_VERIFY: "false"
          SHOPIFY_WEBHOOK_SECRET: test_shopify_secret_key
          WOOCOMMERCE_WEBHOOK_SECRET: wc_webhook_secret_key
        run: |
          python -m pytest backend/tests/ -v

  frontend-build:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Frontend Typecheck
        run: npm run typecheck

      - name: Frontend Lint
        run: npm run lint --if-present

      - name: Frontend Production Bundle Build
        run: npm run build
